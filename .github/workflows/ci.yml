# From the package-modernize NuGet ci.yml template (2026-09-27), on GitHub-hosted runners: the build job runs on Linux,
# Windows and macOS (plan D9 and the seed promise: the golden tests pass on every runtime).
# Every push to master and every pull request: no committed golden file changed, locked restore, dotnet format, build
# with warnings as errors, the NuGet audit, the tests (net10.0 everywhere, and net48 on Windows), the console sample, the
# Unity .meta check, a pack, then on Linux the content and dependency check and the size gate, and the final `ci` job the
# ruleset on master requires.
# Actions are pinned to commit SHAs with the version in a comment (from the template, checked 2026-09-27).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Source Link records the commit; the golden check needs the base commit
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # The seed promise (AGENTS.md): a golden file in a release never changes; the legacy recordings never change.
      - name: No released golden file changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- tests/Golden/legacy)
            if [ -n "$changed" ]; then
              echo "::error::the legacy recordings are a record and never change: $changed"
              exit 1
            fi
          fi
          tags=$(git tag -l 'v*' --sort=-v:refname)
          tag=${tags%%$'\n'*}
          if [ -z "$tag" ]; then
            echo "nothing released yet: a golden file may still be rewritten on purpose, said in the commit message"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$tag" HEAD -- tests/Golden)
          if [ -n "$changed" ]; then
            echo "::error::golden files released in $tag changed or deleted (add a generator version instead): $changed"
            exit 1
          fi
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      - name: NuGet audit as errors
        run: dotnet restore -p:AuditPipeline=true --force
      - name: Test (net10.0)
        run: dotnet test --no-build -c Release -f net10.0 --logger trx --results-directory TestResults
      - name: Test (net48, Windows only; exercises the netstandard2.0 build)
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release -f net48 --logger trx --results-directory TestResults
      - name: Run the console sample (the README's examples)
        run: dotnet run --project samples/ConsoleSample --no-build -c Release > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7
      - name: Every Unity package file has a .meta with a unique GUID
        run: |
          if command -v python >/dev/null; then py=python; else py=python3; fi
          "$py" scripts/add-meta.py --check
      - name: Pack
        run: dotnet pack src/UniverseGenerator --no-build -c Release -o artifacts
      # The package is the same on every OS (deterministic build); release.yml packs and checks it on Linux too.
      - name: The package holds exactly what it should and declares no dependencies
        if: runner.os == 'Linux'
        run: bash scripts/check-package.sh artifacts
      - name: Size gate (plan D19)
        if: runner.os == 'Linux'
        run: |
          if command -v python >/dev/null; then py=python; else py=python3; fi
          "$py" scripts/size-gate.py artifacts

  ci:
    name: ci
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done
