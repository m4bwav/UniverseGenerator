# Weekly update pull requests (package-modernize template, 2026-09-27). Merge when CI is green; read the release notes
# before merging a major. The library has no runtime dependencies, so every NuGet update here is a test or build package.
# The seven-day cooldown keeps brand-new releases out until they have had time to be pulled if bad.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
  # Updates the SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
